version: '3.8'

services:
  mimit-carburanti:
    build: .
    container_name: mimit-carburanti-map
    ports:
      - "8080:8080"
    volumes:
      # Mantiene persistente il database SQLite e la cache dati
      - ./carburanti.db:/app/carburanti.db
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PORT=8080
